name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build fetches each integrated live source once (Experiment 003):
      # NASA FIRMS's two open "South East Asia" VIIRS files (no MAP_KEY is set
      # in CI, so the keyless path is used), five data.gov.sg real-time APIs
      # (without a key) and one data.gov.my forecast request. A source that
      # fails or times out renders "unavailable" rather than failing the build.
      - run: npm run build
